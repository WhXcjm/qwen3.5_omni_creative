# 并行策略
parallel:
  tensor_parallel_size: 1
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules: # 如果要开prefetch的话，请不要随意修改apply_modules的顺序
      - model.visual
      - model.visual.blocks.{*}
      - model.language_model
      - model.language_model.embed_tokens
      - model.language_model.layers.{*}
      - model.language_model.layers.{*}.linear_attn
      - model.language_model.layers.{*}.mlp.experts
      - lm_head
    hook_modules:
      - model.language_model.layers.{*}
    param_dtype: bf16
    reduce_dtype: fp32
    num_to_forward_prefetch: 1
    num_to_backward_prefetch: 1
  ring_attention_size: 1
  ulysses_parallel_size: 1 # 开启 ulysses-cp 时, 请将 model 的 attn_implementation 设置为 flash_attention_2
  expert_parallel_size: 1
  ep_plan:
    apply_modules:
      - model.language_model.layers.{*}.mlp.experts

### 数据相关配置
data:
  dataset_param:
    dataset_type: huggingface
    #数据集属性
    attr:
      formatting: alpaca
      prompt: text

    # 数据预处理
    preprocess_parameters:
      model_name_or_path: ./hf_models/qwen3_5-10b-a2b-exp4
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64

    basic_parameters:
      cutoff_len: 4096
      template: default
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      # tool_format: null
      dataset_dir: /data/w50062357/data/train/olmoe/
      dataset: /data/w50062357/data/train/olmoe/dclm-text-0000.jsonl
      cache_dir: /data/w50062357/data/cache/cache_dir/
      overwrite_cache: false
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      max_samples: null
      packing: true
      stage: pretrain

  # 数据加载
  dataloader_param:
    pin_memory: true
    shuffle: true
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: llm_pretrain
      ignore_pad_token_for_loss: true

# 模型配置
model:
  model_id: qwen3_5_moe
  model_name_or_path: ./hf_models/qwen3_5-10b-a2b-exp4
  trust_remote_code: true
  attn_implementation: flash_attention_2
  freeze:
    - model.visual
  # MTP配置
  mtp_num_layers: 1
  mtp_loss_scaling_factor: 0.3
  # 融合算子配置
  use_triton_gdn: true
  use_grouped_expert_matmul: true

# 优化特性配置
features:
  # loss 配置
  loss_cfg:
    loss_type: default   # If you want raw loss in model, loss_type can be set to "raw".
    router_aux_loss_coef: 0.001
  # 重计算配置
  recompute: true
  recompute_plan:
      apply_modules:
        - model.visual.blocks.{*}
        - model.language_model.layers.{*}
  # chunkloss配置
  enable_chunk_loss: true
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  # activation offload 配置
  enable_activation_offload: false
  activation_offload_plan:
    apply_modules:
     - model.visual.blocks.{*}
     - model.language_model.layers.{*}
  # chunkmbs配置
  enable_chunk_mbs: false
  chunkmbs_plan:
    apply_modules:
     - model.language_model.layers.{*}
    chunk_mbs: 2 # 这个表示的是chunk之后的micro batchsize
    batch_dim: 0
    chunk_arg_indexs: [0]
    chunk_kwarg_names: ["position_embeddings", "position_ids", "rope_deltas", "attention_mask"]

# 训练配置
training:
  seed: 42
  optimizer: muon
  lr: 4.0e-4
  lr_min: 4.0e-5
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  train_iters: 5000
  lr_decay_style: cosine
  lr_warmup_ratio: 0.01
  weight_decay: 1.0e-1
  clip_grad: 1.0
  init_model_with_meta_device: true
  adam_fused: true
  save_interval: 1000
  save: /data/w50062357/weights/qwen3_5_10B-A2B_exp4_gas32_muon_lr4e-4_r2_260804
  use_deter_comp: false
  plugin:
    - mindspeed_mm/fsdp/models/qwen3_5_moe
    - mindspeed_mm/fsdp/data/datasets/huggingface

# 工具配置
tools:
  profile:
    enable: false
    profile_type: static
    ranks: [-1]
    static_param:
      level: level1
      with_stack: false
      with_memory: false
      record_shapes: false
      with_cpu: true
      save_path: ./profiling/rank0-15
      start_step: 5
      end_step: 10
      data_simplification: true
      aic_metrics_type: PipeUtilization
  memory_profile:
      enable: false
      start_step: 1
      end_step: 2
      save_path: ./memory_snapshot
      dump_ranks: [0]
      stacks: all
      max_entries: null
      mem_info: false
