# 并行策略
parallel:
  tensor_parallel_size: 1
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
      - model.visual.blocks.{*}
      - model.visual
      - model.language_model.layers.{*}
      - model.language_model.embed_tokens
      - model.language_model
      - lm_head
    param_dtype: bf16
    reduce_dtype: fp32
  recompute: true
  recompute_plan:
      apply_modules:
        - model.language_model.layers.{0-5}
  ring_attention_size: 1
  ulysses_parallel_size: 1
  expert_parallel_size: 1

### 数据相关配置
data:
  dataset_param:
    dataset_type: huggingface
    #数据集属性
    attr:
      formatting: alpaca
      pretrain: true
      prompt: text

    # 数据预处理
    preprocess_parameters:
      model_name_or_path: ./hf_models/qwen3_5-4b
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64

    basic_parameters:
      cutoff_len: 4096
      template: default
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      dataset_dir: /mnt/yWXKUIzKaqvtk0rLm/model_train/data/300B
      dataset: 300B_part1_of_9.json,300B_part2_of_9.json,300B_part3_of_9.json
      cache_dir: ./cache_dir/
      overwrite_cache: false
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      max_samples: null
      packing: true

  # 数据加载
  dataloader_param:
    pin_memory: true
    shuffle: false
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: llm
      ignore_pad_token_for_loss: true

# 模型配置
model:
  model_id: qwen3_5
  model_name_or_path: ./hf_models/qwen3_5-4b
  trust_remote_code: true
  attn_implementation: sdpa
  freeze:
    - model.visual
  loss_cfg:
    loss_type: default   # If you want raw loss in model, loss_type can be set to "raw".
    router_aux_loss_coef: 0.0
  enable_chunk_loss: false
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  use_triton_gdn: true

# 训练配置
training:
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  seed: 42
  lr: 4.0e-4
  lr_min: 4.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.01
  weight_decay: 1.0e-1
  train_iters: 15000
  clip_grad: 1.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 10000
  save: /mnt/yWXKUIzKaqvtk0rLm/model_train/exp/MindSpeed-MM/ckpt/qwen3_5-exp1
  use_deter_comp: false
  plugin:
    - mindspeed_mm/fsdp/models/qwen3_5
    - mindspeed_mm/fsdp/data/datasets/huggingface

# 工具配置
tools:
  profile:
    enable: false
    profile_type: static
    ranks: [0]
    static_param:
      level: level1
      with_stack: false
      with_memory: false
      record_shapes: false
      with_cpu: true
      save_path: ./profiling
      start_step: 10
      end_step: 11
      data_simplification: false
      aic_metrics_type: PipeUtilization
  memory_profile:
      enable: false
      start_step: 1
      end_step: 2
      save_path: ./memory_snapshot
      dump_ranks: [0]
      stacks: all
      max_entries: null
      mem_info: false